name: Koen r-a boundary-blind Yale test

on:
  push:
    branches:
      - experiment/koen-ra-gap-boundaryblind-20260822
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary-blind-ra-gap:
    if: github.head_ref != 'experiment/koen-ra-gap-v05-dino-locator-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install CPU image-analysis dependencies
        run: python -m pip install --quiet numpy opencv-python-headless requests
      - name: Verify frozen protocol exists before execution
        run: |
          set -euo pipefail
          test -s experiments/koen_ra_gap_blind/PROTOCOL.md
          sha256sum experiments/koen_ra_gap_blind/PROTOCOL.md
      - name: Run boundary-blind Yale-line experiment
        run: |
          set -euo pipefail
          python experiments/koen_ra_gap_blind/koen_ra_gap_blind.py 2>&1 | tee koen_ra_gap_blind.log
      - name: Upload full audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koen-ra-gap-v02-boundaryblind
          path: |
            koen_ra_gap_blind.log
            experiments/koen_ra_gap_blind/PROTOCOL.md
            experiments/koen_ra_gap_blind/koen_ra_gap_blind.py
            results/koen_ra_gap_blind/
          if-no-files-found: warn
          retention-days: 90

  v05-visual-locator:
    if: github.head_ref == 'experiment/koen-ra-gap-v05-dino-locator-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install CPU visual-analysis dependencies
        run: python -m pip install --quiet numpy opencv-python-headless requests scikit-learn
      - name: Decode and verify frozen V05 source and protocol
        run: |
          set -euo pipefail
          mkdir -p /tmp/v05 experiments/koen_ra_gap_v05 results/koen_ra_gap_v05
          base64 -d tools/koen_v05_visual_locator.py.gz.b64 | gzip -d > /tmp/v05/koen_v05_visual_locator.py
          base64 -d tools/koen_v05_protocol.md.gz.b64 | gzip -d > experiments/koen_ra_gap_v05/PROTOCOL.md
          test "$(sha256sum /tmp/v05/koen_v05_visual_locator.py | awk '{print $1}')" = "cdb454b8acbc2f00df3e0700e6c1622582bbff18c4e89c8326fc1d65ba9c8080"
          test "$(sha256sum experiments/koen_ra_gap_v05/PROTOCOL.md | awk '{print $1}')" = "57725efb7f7fea25890d2a178e3e7b05ad09115fe21ad63861d67bbad3b84803"
          cp /tmp/v05/koen_v05_visual_locator.py results/koen_ra_gap_v05/koen_v05_visual_locator.py
          sha256sum /tmp/v05/koen_v05_visual_locator.py experiments/koen_ra_gap_v05/PROTOCOL.md
      - name: Run V05 held-out calibration then target test if valid
        run: |
          set -euo pipefail
          python /tmp/v05/koen_v05_visual_locator.py 2>&1 | tee koen_v05.log
      - name: Show V05 report
        if: always()
        run: |
          echo '----- V05 REPORT -----'
          cat results/koen_ra_gap_v05/REPORT_V05.md 2>/dev/null || true
          echo '----- END V05 REPORT -----'
      - name: Upload V05 audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koen-ra-gap-v05-visual-locator
          path: |
            koen_v05.log
            experiments/koen_ra_gap_v05/PROTOCOL.md
            results/koen_ra_gap_v05/
          if-no-files-found: warn
          retention-days: 90
