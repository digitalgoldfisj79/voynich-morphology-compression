name: Koen r-a V05 proposal probe

on:
  push:
    branches:
      - experiment/koen-ra-gap-v05-dino-locator-20260823
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proposal-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOMIC_API_KEY: ${{ secrets.NOMIC_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install probe dependencies
        run: python -m pip install --quiet nomic pandas pyarrow
      - name: Probe public July proposal corpus
        run: python tools/koen_v05_probe.py
