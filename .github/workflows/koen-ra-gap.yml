name: Koen r-a physical gap test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ra-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install DINO image-analysis dependencies
        run: python -m pip install --quiet numpy opencv-python-headless requests
      - name: Apply page-header parser bugfix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('experiments/koen_ra_gap/koen_ra_gap.py')
          s=p.read_text()
          old='PAGE_RE = re.compile(r"^<(?P<folio>f[^>]+)>\\s+<!\\s*(?P<meta>.*?)>")'
          new='PAGE_RE = re.compile(r"^<(?P<folio>f\\d+[rv]\\d*)>\\s+<!\\s*(?P<meta>.*?)>", re.I)'
          if old not in s:
              raise SystemExit('expected PAGE_RE not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Run frozen r-a gap experiment
        run: |
          set -euo pipefail
          python experiments/koen_ra_gap/koen_ra_gap.py 2>&1 | tee koen_ra_gap.log
      - name: Show result report
        if: always()
        run: |
          echo '----- REPORT -----'
          cat results/koen_ra_gap/REPORT.md 2>/dev/null || true
          echo '----- END REPORT -----'
      - name: Upload full audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koen-ra-gap-v01
          path: |
            koen_ra_gap.log
            experiments/koen_ra_gap/PROTOCOL.md
            results/koen_ra_gap/
          if-no-files-found: warn
          retention-days: 90

  boundary-blind-v02:
    if: github.event_name == 'pull_request' && github.head_ref == 'experiment/koen-ra-gap-boundaryblind-20260822'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install CPU image-analysis dependencies
        run: python -m pip install --quiet numpy opencv-python-headless requests
      - name: Verify frozen V02 protocol
        run: |
          set -euo pipefail
          test -s experiments/koen_ra_gap_blind/PROTOCOL.md
          sha256sum experiments/koen_ra_gap_blind/PROTOCOL.md
      - name: Run boundary-blind Yale-line experiment
        run: |
          set -euo pipefail
          python experiments/koen_ra_gap_blind/koen_ra_gap_blind.py 2>&1 | tee koen_ra_gap_blind.log
      - name: Show V02 report
        if: always()
        run: |
          echo '----- V02 REPORT -----'
          cat results/koen_ra_gap_blind/REPORT.md 2>/dev/null || true
          echo '----- END V02 REPORT -----'
      - name: Upload V02 audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koen-ra-gap-v02-boundaryblind
          path: |
            koen_ra_gap_blind.log
            experiments/koen_ra_gap_blind/PROTOCOL.md
            experiments/koen_ra_gap_blind/koen_ra_gap_blind.py
            results/koen_ra_gap_blind/*.json
            results/koen_ra_gap_blind/*.csv
            results/koen_ra_gap_blind/REPORT.md
          if-no-files-found: warn
          retention-days: 90
