name: P586 human-readable bundle

on:
  push:
    branches:
      - gpt56/p586-root-v01-20260803
    paths:
      - '.github/workflows/p586-human-readable-bundle.yml'
      - 'experiments/palatino586_root_v01/build_human_readable_bundle.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out frozen branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Build verified bundle
        id: build
        continue-on-error: true
        run: python experiments/palatino586_root_v01/build_human_readable_bundle.py

      - name: Verify local ZIP exists
        if: always()
        run: |
          test -f /tmp/p586_bundle/Palatino586_Voynich_Root_Morphology_Human_Readable_v01.zip
          sha256sum /tmp/p586_bundle/Palatino586_Voynich_Root_Morphology_Human_Readable_v01.zip
          unzip -t /tmp/p586_bundle/Palatino586_Voynich_Root_Morphology_Human_Readable_v01.zip

      - name: Upload bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Palatino586_Voynich_Root_Morphology_Human_Readable_v01
          path: /tmp/p586_bundle/Palatino586_Voynich_Root_Morphology_Human_Readable_v01.zip
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
